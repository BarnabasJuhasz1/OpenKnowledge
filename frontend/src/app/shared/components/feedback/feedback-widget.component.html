@if (enabled()) {
  <!-- Floating launcher, present on every route -->
  <button
    class="feedback-fab"
    type="button"
    aria-label="Send feedback"
    title="Send feedback"
    (click)="launch('bug')"
  >
    <span class="material-symbols-outlined">chat_bubble</span>
    <span class="feedback-fab__label">Feedback</span>
  </button>
}

@if (open()) {
  <div class="feedback-overlay" (click)="close()">
    <div
      class="feedback-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="feedback-title"
      (click)="$event.stopPropagation()"
    >
      <button class="feedback-card__close" type="button" aria-label="Close" (click)="close()">
        <span class="material-symbols-outlined">close</span>
      </button>

      <h2 class="feedback-card__title" id="feedback-title">Send feedback</h2>
      <p class="feedback-card__subtitle">
        Help us improve OpenKnowledge during the alpha.
      </p>

      <!-- Mode tabs -->
      <div class="feedback-tabs" role="tablist">
        <button
          class="feedback-tab"
          type="button"
          role="tab"
          [class.feedback-tab--active]="mode() === 'bug'"
          [attr.aria-selected]="mode() === 'bug'"
          (click)="setMode('bug')"
        >
          <span class="material-symbols-outlined">bug_report</span>
          Report a bug
        </button>
        <button
          class="feedback-tab"
          type="button"
          role="tab"
          [class.feedback-tab--active]="mode() === 'feature'"
          [attr.aria-selected]="mode() === 'feature'"
          (click)="setMode('feature')"
        >
          <span class="material-symbols-outlined">lightbulb</span>
          Request a feature
        </button>
      </div>

      <form class="feedback-form" (ngSubmit)="submit()">
        <label class="feedback-field">
          <span class="feedback-field__labelrow">
            <span class="feedback-field__label">Title</span>
            <span
              class="feedback-field__count"
              [class.feedback-field__count--warn]="title().length >= limits.title"
            >{{ title().length }} / {{ limits.title }}</span>
          </span>
          <input
            type="text"
            class="feedback-field__input"
            [maxlength]="limits.title"
            [placeholder]="mode() === 'bug' ? 'Brief summary of the bug' : 'What would you like to see?'"
            [ngModel]="title()"
            (ngModelChange)="title.set($event)"
            name="title"
            required
          />
        </label>

        <label class="feedback-field">
          <span class="feedback-field__labelrow">
            <span class="feedback-field__label">Description</span>
            <span
              class="feedback-field__count"
              [class.feedback-field__count--warn]="description().length >= limits.description"
            >{{ description().length }} / {{ limits.description }}</span>
          </span>
          <textarea
            class="feedback-field__input feedback-field__textarea"
            rows="4"
            [maxlength]="limits.description"
            [placeholder]="mode() === 'bug' ? 'What happened? What did you expect?' : 'Describe the feature.'"
            [ngModel]="description()"
            (ngModelChange)="description.set($event)"
            name="description"
            required
          ></textarea>
        </label>

        @if (mode() === 'bug') {
          <label class="feedback-field">
            <span class="feedback-field__labelrow">
              <span class="feedback-field__label">Steps to reproduce <span class="feedback-field__opt">(optional)</span></span>
              <span
                class="feedback-field__count"
                [class.feedback-field__count--warn]="steps().length >= limits.steps"
              >{{ steps().length }} / {{ limits.steps }}</span>
            </span>
            <textarea
              class="feedback-field__input feedback-field__textarea"
              rows="3"
              [maxlength]="limits.steps"
              placeholder="1. … 2. … 3. …"
              [ngModel]="steps()"
              (ngModelChange)="steps.set($event)"
              name="steps"
            ></textarea>
          </label>

          <label class="feedback-field">
            <span class="feedback-field__label">Severity</span>
            <select
              class="feedback-field__input"
              [ngModel]="severity()"
              (ngModelChange)="severity.set($event)"
              name="severity"
            >
              @for (level of severities; track level) {
                <option [value]="level">{{ level }}</option>
              }
            </select>
          </label>
        } @else {
          <label class="feedback-field">
            <span class="feedback-field__labelrow">
              <span class="feedback-field__label">Why do you want this? <span class="feedback-field__opt">(optional)</span></span>
              <span
                class="feedback-field__count"
                [class.feedback-field__count--warn]="motivation().length >= limits.motivation"
              >{{ motivation().length }} / {{ limits.motivation }}</span>
            </span>
            <textarea
              class="feedback-field__input feedback-field__textarea"
              rows="3"
              [maxlength]="limits.motivation"
              placeholder="What problem would it solve for you?"
              [ngModel]="motivation()"
              (ngModelChange)="motivation.set($event)"
              name="motivation"
            ></textarea>
          </label>
        }

        <label class="feedback-field">
          <span class="feedback-field__label">Contact email <span class="feedback-field__opt">(optional)</span></span>
          <input
            type="email"
            class="feedback-field__input"
            [maxlength]="limits.contactEmail"
            placeholder="So we can follow up"
            [ngModel]="contactEmail()"
            (ngModelChange)="contactEmail.set($event)"
            name="contactEmail"
          />
        </label>

        @if (mode() === 'bug') {
          <p class="feedback-note">
            Your current page and browser details are included automatically.
          </p>
        }

        @if (error()) {
          <p class="feedback-error">{{ error() }}</p>
        }

        <div class="feedback-actions">
          <button class="feedback-btn feedback-btn--ghost" type="button" (click)="close()" [disabled]="submitting()">
            Cancel
          </button>
          <button class="feedback-btn feedback-btn--primary" type="submit" [disabled]="!canSubmit()">
            {{ submitting() ? 'Submitting…' : 'Submit' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
