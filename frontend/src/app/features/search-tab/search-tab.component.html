<div class="search-tab">
  <div class="search-tab__inner">
    <h1 class="search-tab__title">Discover Research Literature</h1>
    <p class="search-tab__subtitle">
      Search across OpenAlex, Semantic Scholar, arXiv, PubMed, DBLP, CrossRef, Europe PMC and CORE — open source, no subscription required.
    </p>

    <div class="search-tab__search">
      <app-prompt-keywords (generated)="onKeywordsGenerated($event)" />
      <app-query-input
        [initialQuery]="state.rawQuery()"
        [loading]="state.loading()"
        (search)="onSearch($event)"
      />
    </div>

    <div class="mode-select" role="radiogroup" aria-label="Search mode">
      <span class="mode-select__label">Search mode</span>
      <div class="mode-select__pills">
        @for (opt of modeOptions; track opt.id) {
          <button
            type="button"
            role="radio"
            class="mode-select__pill"
            [class.mode-select__pill--active]="mode.mode() === opt.id"
            [attr.aria-checked]="mode.mode() === opt.id"
            [title]="opt.hint"
            (click)="mode.setMode(opt.id)"
          >
            {{ opt.label }}
          </button>
        }
      </div>
    </div>
  </div>
</div>
