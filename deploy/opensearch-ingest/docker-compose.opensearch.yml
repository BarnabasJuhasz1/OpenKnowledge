# OPTIONAL: run OpenSearch on the GCP instance via Docker, with its data on the
# 250 GB SSD. Adjust `OPENSEARCH_JAVA_OPTS` heap to ~50% of instance RAM (max 31g)
# and set the SSD mount path below. Single-node, security disabled — lock the
# instance down at the network layer (firewall 9200 to your backend only).
#
#   1. point the volume at your SSD MOUNT (GCP attached disks land at
#      /mnt/disks/<name>; verify with `df -h` / `lsblk` — a path that is NOT a real
#      mount silently writes to the small boot disk and fills it)
#   2. sudo sysctl -w vm.max_map_count=262144   (persist in /etc/sysctl.conf)
#   3. docker compose -f docker-compose.opensearch.yml up -d
#
# `restart: unless-stopped` + Docker's own service starting on boot means OpenSearch
# comes back by itself after a reboot — no manual `up` needed. Make sure the SSD is
# mounted at boot (see /etc/fstab in the README) BEFORE the container starts, or it
# will come up with an empty data dir.
services:
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms8g -Xmx8g   # set to ~50% of RAM
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      # Left side MUST be a REAL mount of your 250 GB SSD (confirm with `df -h`).
      # The OpenSearch process runs as uid 1000 — `sudo chown -R 1000:1000 <path>` once.
      - /mnt/disks/opensearch_data:/usr/share/opensearch/data
